AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 
  TaskFlow - Production Ready Serverless Task Management API

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:

  TodoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskFlowTable

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S

      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
Outputs:
   TableName:
    Description: DynamoDB Table Name
    Value: !Ref TodoTable